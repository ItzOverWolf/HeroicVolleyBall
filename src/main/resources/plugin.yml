name: HeroicVolleyBall
version: '${version}'
main: me.heroicstudios.heroicvolleyball.HeroicVolleyBall
api-version: '1.21'
description: A Haikyuu inspired volleyball plugin
authors: [HeroicStudios]
softdepend: [PlaceholderAPI, ViaVersion]

commands:
  volleywand:
    description: Gives you the volleyball selection wand (stone axe)
    usage: /volleywand
    permission: heroicvolleyball.volleywand
  setarena:
    description: Sets the selected region as a team's arena
    usage: /setarena <red|blue>
    permission: heroicvolleyball.setarena
  setbackrow:
    description: Sets the selected region as a team's back row
    usage: /setbackrow <red|blue>
    permission: heroicvolleyball.setbackrow
  setballspawnpoint:
    description: Saves where the ball should serve from for a team, or clears it
    usage: /setballspawnpoint <red|blue> [clear]
    permission: heroicvolleyball.setballspawnpoint
  spawnball:
    description: Spawns the volleyball at your location
    usage: /spawnball
    permission: heroicvolleyball.spawnball
  startgame:
    description: Spawns the volleyball near Position 6 to start a game
    usage: /startgame
    permission: heroicvolleyball.startgame
  stopgame:
    description: Stops the current game, removing the ball and music and resetting the score
    usage: /stopgame
    permission: heroicvolleyball.stopgame
  restartgame:
    description: Restarts the game, resetting the score and respawning the ball
    usage: /restartgame
    permission: heroicvolleyball.restartgame
  volleygive:
    description: Gives a volleyball tool
    usage: /volleygive <shovel|sword|shield> [wooden|iron|diamond]
    permission: heroicvolleyball.volleygive
  volleyreload:
    description: Reloads the HeroicVolleyBall configuration
    usage: /volleyreload
    permission: heroicvolleyball.volleyreload
  volleymusic:
    description: Plays Note Block Studio music for the game
    usage: /volleymusic <start|stop|list|reload> [song]
    permission: heroicvolleyball.volleymusic
  partycreate:
    description: Creates a party
    usage: /partycreate
    permission: heroicvolleyball.party
  partyinvite:
    description: Invites a player to your party
    usage: /partyinvite <player>
    permission: heroicvolleyball.party
  partyleave:
    description: Leaves your current party
    usage: /partyleave
    permission: heroicvolleyball.party
  partydisband:
    description: Disbands your party (leader only)
    usage: /partydisband
    permission: heroicvolleyball.party

permissions:
  heroicvolleyball.volleywand:
    description: Allows use of /volleywand
    default: op
  heroicvolleyball.setarena:
    description: Allows use of /setarena
    default: op
  heroicvolleyball.setbackrow:
    description: Allows use of /setbackrow
    default: op
  heroicvolleyball.setballspawnpoint:
    description: Allows use of /setballspawnpoint
    default: op
  heroicvolleyball.spawnball:
    description: Allows use of /spawnball
    default: op
  heroicvolleyball.startgame:
    description: Allows use of /startgame
    default: op
  heroicvolleyball.stopgame:
    description: Allows use of /stopgame
    default: op
  heroicvolleyball.restartgame:
    description: Allows use of /restartgame
    default: op
  heroicvolleyball.volleygive:
    description: Allows use of /volleygive
    default: op
  heroicvolleyball.volleyreload:
    description: Allows use of /volleyreload
    default: op
  heroicvolleyball.volleymusic:
    description: Allows use of /volleymusic
    default: op
  heroicvolleyball.party:
    description: Allows use of the party commands
    default: true
