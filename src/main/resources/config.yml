# HeroicVolleyBall configuration
#
# New settings added in later versions are inserted here automatically on
# startup and on /volleyreload - you never need to delete this file to get
# them. Your own values are never overwritten.
#
# Court coordinates are NOT stored here. Every arena lives in its own file at
# plugins/HeroicVolleyBall/arenas/<name>.yml, holding both court regions,
# backrow regions, ball spawns, position 1-6 spots and facing directions, so a
# finished setup can be copied between servers file by file. Use /volleyarena
# to create, list, inspect, enable or delete arenas. Existing single-arena
# installs (arenas.yml, positions.yml, backrow.yml, ballspawn.yml) are migrated
# into arenas/default.yml automatically on first start.

# Ball physics and rule settings. Reload live with /volleyreload.
ball:
  # Ball size in blocks (1 = small, 2 = default, ...). Scales BOTH the
  # invisible click hitbox and the visible player head (the head always
  # matches the hitbox height), so the ball you see and the ball you hit
  # are the same size.
  size: 1.5
  # Maximum number of touches a team gets per possession.
  max-touches: 3
  # Downward acceleration applied to the ball every tick (blocks/tick^2).
  gravity: 0.045
  # Fraction of velocity kept every tick (air resistance). 1.0 = no drag.
  air-drag: 0.99
  # Global multiplier applied to every tool impulse.
  velocity-scale: 1.0
  # Maximum speed any component of the ball may reach.
  max-velocity: 3.0
  # Sword spike behaviour, decided by where the player hits relative to the ball.
  spike:
    # Vertical gap (blocks) above/below the ball before a hit counts as top/bottom.
    vertical-threshold: 1.0
    # Speed used when spiking down from above (fastest).
    top-down: 1.5
    # Horizontal speed retained on a top-down spike (0 = straight down).
    top-horizontal: 0.25
    # Upward speed added on a level hit; gravity then arcs it down.
    straight: 0.2
    # Upward speed added when hitting from below, bouncing it up and forward.
    up: 0.7
  # Fraction of the shovel's upward power added as forward drift (0 = straight
  # up, 0.25 = slightly forward in the direction you are facing).
  shovel-forward: 0.15
  # Shield (Block) tool behaviour. The shield never uses a team touch.
  # - Left-click a ball at its middle or top to knock it forward and down.
  # - Hold right-click (shield raised) underneath the ball to catch it and pop
  #   it up like a free ball - no timing click, just aim at the bottom.
  # After any shield use the shield is on cooldown and can't be used again
  # until it recharges; the shovel and sword still work, so you catch with the
  # shield and follow up with the shovel.
  shield:
    # Downward speed applied when deflecting a middle/top hit (0 = straight down).
    deflect: 0.9
    # Forward speed added in the direction you are facing when deflecting.
    forward: 0.6
    # Upward speed of the ball when caught from below.
    catch-power: 0.8
    # Max horizontal distance (blocks) between the catching player and the ball.
    catch-reach: 2.5
    # Max vertical gap (blocks) between the player's eye and the ball's bottom.
    catch-height: 3.0
    # Ticks the shield is unusable after a deflect or catch (20 ticks = 1 second).
    cooldown: 100
  # Hit detection fallback for fast-falling balls. When the client and the
  # server disagree about where the ball is, the vanilla attack packet can
  # miss even though you clearly clicked the ball you saw. an arm swing whose
  # crosshair ray reaches the server-side ball then counts as the hit -
  # identical tools, cooldowns, touch limits and penalties apply, and it is
  # deduplicated against the real attack so one click = one hit.
  hit:
    # Master switch for the swing fallback above.
    swing-fallback: true
    # Extra reach (blocks) added to your entity interaction range for the
    # fallback. The game's tools.reach-bonus applies on top of this.
    swing-reach-buffer: 0.5
    # How much of the ball's per-tick speed (0 = none, 1 = full, capped at
    # 4 blocks) is added to the aim tolerance, so swinging where you SAW the
    # ball still counts when the ball has dropped since.
    swing-speed-tolerance: 1.0
  # Fraction of downward speed kept as a bounce when the ball lands (0 = none).
  bounce: 0.4
  # Any landing bounce slower than this is treated as settled (speed 0), so the
  # ball stops cleanly on the floor instead of creeping and jittering forever.
  settle-threshold: 0.12
  # Ticks to wait after the ball lands before the point is reset to a serve.
  # A short delay lets the ball visibly settle instead of teleporting away.
  serve-reset-delay: 10
  # Safety net (seconds) for a ball that never returns to play: launched out of
  # bounds, or wedged and idle during a rally for longer than this. When it
  # trips, the ball is reset to a serve for the side that last had it. 0 = off.
  stuck-timeout: 30
  # If true, the floating name above the ball (Serve / touches) is shown.
  # When the ball is invisible, the name is carried by a hologram so it stays
  # visible to every player (vanilla hides name tags on invisible mobs).
  show-name: true
  # Dark plate behind the hologram text so it stays readable against the sky
  # and the court. "#RRGGBB" gets 90% opacity automatically, "#AARRGGBB" sets
  # alpha yourself (00 = clear, FF = solid), "none" disables the plate.
  # Reload live with /volleyreload.
  name-background: "#E6141A20"
  # If true, players can right-click the ball with an empty hand to pick it up
  # into their inventory, then right-click a block in the ball's team area to
  # place it back. Only allowed while the round has not started (the ball has
  # not been hit), and only once per serve - after placing it cannot be picked
  # up again until the next point resets the ball.
  pickup-enabled: true
  # What the ball (and the item you pick up) looks like. Any block or item
  # material name works (for example GRAY_WOOL, SLIME_BALL, DIAMOND, GLOWSTONE,
  # PLAYER_HEAD). If the material is a wool (_WOOL), the ball is coloured by
  # possession: red over a red court, blue over a blue court, gray elsewhere.
  material: PLAYER_HEAD
  # Custom player head skin, shown when material is PLAYER_HEAD. This is the
  # base64 "textures" value from your skin (the part after the JSON value).
  # Leave empty to use a normal Steve/head texture for this material.
  texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNDdkYWIwOGMyMTQ0NGVmMGRkZWU2OWJjMjYxYzFkNmQ5ZWZhMmU2MTE1Y2U1NzRkZTBlNTAyODAyZGMwMjJhNyJ9fX0="
  # Client-side visual polish for the ball. All of these are cosmetic only -
  # they never change the physics or the hitbox - and can be toggled live with
  # /volleyreload.
  visual:
    # Spin the visible head about the axis it is travelling, so a rolling ball
    # looks like a rolling ball.
    spin: true
    # Show a small ring of dark dust on the floor under the ball (its "shadow")
    # so players can judge where it will land.
    shadow: true
    # Leave a short particle trail behind the ball while it is moving.
    trail: true
    # Speed (blocks/tick) above which the trail starts showing.
    trail-speed: 0.6
    # Make the visible head briefly swell when it is hit, so contacts feel
    # physical.
    hit-pulse: true
    # Scale the volume and pitch of ball hit sounds with how hard the ball was
    # struck - a soft bump and a full-power spike stop sounding identical.
    scaled-hit-sound: true
  # Per-tier tool power.
  power:
    shovel:
      wooden: 0.6
      iron: 0.8
      diamond: 1.1
    spike:
      wooden: 0.2
      iron: 0.6
      diamond: 1.0

# Match rules.
game:
  # Points a team needs to win a single set.
  points-per-set: 25
  # Sets a team needs to win the match (best of 2 * sets-to-win - 1).
  sets-to-win: 2
  # If true, hitting the ball while it is over the opponent's half gives the
  # opponent a point. The neutral gray ball (over the net / flying out of bounds)
  # is always free to touch and never causes this penalty.
  opponent-touch-penalty: true
  # Potion effects every player receives while a game is running. Applied when a
  # game starts and removed when it ends. Set a level to 0 to disable it.
  effects:
    enabled: true
    jump-boost-level: 5
    speed-level: 5
  # Show big on-screen titles when a point, set or match is won.
  titles: true
  # Announce points, sets and match wins in chat.
  broadcast-points: true
  # Seconds counted down on screen before each serve after a point.
  point-countdown: 3
  # Seconds counted down on screen between sets (rounds).
  round-countdown: 5

# Sidebar scoreboard shown to every player.
scoreboard:
  enabled: true
  # Also show the live sidebar to players standing inside an arena who are not
  # playing that match (spectators), and remove it when they step out or the
  # match ends.
  viewers: true

# Party settings for multiplayer games.
party:
  # Maximum number of players a party can hold (must be even to start a game).
  max-size: 12

# Volleyball tool settings.
tools:
  # Extra blocks added to every player's entity interaction range while a game
  # is running, so tools can reach the ball from further away.
  reach-bonus: 2.0

# Note Block Studio (.nbs) music played during matches.
# Drop your .nbs files into plugins/HeroicVolleyBall/music/ and set the file below.
music:
  enabled: true
  song: haikyuu.nbs
  volume: 1.0

# Arena selection. Each arena is a file in plugins/HeroicVolleyBall/arenas/.
# This is the arena that commands and placeholders use when no arena name is
# given, and it must exist in arenas/ to be selected.
arena:
  default: default

# What happens to a player who leaves a running game.
session:
  # Save and restore a player's inventory/effects when they teleport to another
  # world (for example a lobby portal).
  restore-on-world-change: true
  # Save and restore a player's inventory/effects when they walk out of the
  # arena's court/backrow regions.
  restore-on-leave: false
