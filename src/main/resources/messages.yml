  set: "<gray>The {team} <gray>back row for arena <white>{arena}</white> <gray>has been set: <aqua>{location}</aqua>"

ballspawn:
  usage: "<red>Usage: /vb admin setballspawnpoint <red|blue> [arena] [clear]"
  unknown-team: "<red>Unknown team \"{input}\". Use red or blue."
