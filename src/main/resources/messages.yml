  left-broadcast: "<gray>{player} left the team."
  disbanded: "<yellow>Your team has been disbanded."
  disbanded-broadcast: "<gray>The team {team} was disbanded."
  kick-usage: "<red>Usage: /vb team kick <player>"
  kick-self: "<red>Use <white>/vb team leave</white> to leave, or transfer leadership first."
  kick-not-member: "<red>{player} is not on your team."
  kicked: "<yellow>{player} was kicked from the team."
  kick-notify: "<red>You were kicked from {team}."
  transfer-usage: "<red>Usage: /vb team transfer <player>"
  transfer-not-member: "<red>{player} is not on your team."
  transfer-done: "<green>{player} <green>is now the team leader."
  transfer-notify: "<green>You are now the leader of {team}<green>."
  rename-usage: "<red>Usage: /vb team rename <name>"
  renamed: "<green>Team renamed to {team}<green>."
  color-usage: "<red>Usage: /vb team color <hex|name>"
  color-invalid: "<red>Invalid colour. Use a #RRGGBB hex code or a colour name."
  color-set: "<green>Team colour set to {color}<green>."
  chat-usage: "<red>Usage: /vb team chat <message>"
  chat-format: "<gray>[{team}<gray>] <white>{player}<gray>: <white>{message}"
  info-usage: "<red>Usage: /vb team info [team]"
  info-unknown: "<red>No team found matching \"{name}\"."
  info-header: "<#F08E26><bold>{team}</bold> <dark_gray>› <gray>info"
  info-line: "<#FFB347>{label}<gray>: <white>{value}"
  info-member: "<gray>- <white>{player} <dark_gray>(<#FFB347>{role}<dark_gray>) <gray>{status}"
  top-header: "<gold>Top teams by wins:"
  top-empty: "<gray>No teams exist yet."
  top-entry: "<gray>#{rank} <white>{team} <dark_gray>- <green>{wins}W <red>{losses}L"
  in-match: "<red>You cannot do that while your team is in a match."
  role-set: "<green>Your role is now {role}<green>."
  invites-open: "<green>Invitations are now open."
  invites-closed: "<yellow>Invitations are now closed."
  invites-closed-denied: "<red>{team} is not accepting invitations right now."
  offline-kicked: "<yellow>{player} was removed from the team (offline)."

team-input:
  name-prompt: "<#F08E26>Type the new team name in chat, or <white>cancel</white> to stop."
  tag-prompt: "<#F08E26>Type the new team tag in chat, or <white>cancel</white> to stop."
  invite-prompt: "<#F08E26>Type the name of the player to invite in chat, or <white>cancel</white> to stop."
  hex-prompt: "<#F08E26>Type a hex colour like <white>#F08E26</white> in chat, or <white>cancel</white> to stop."
  cancelled: "<gray>Cancelled."
  invalid-hex: "<red>That is not a valid #RRGGBB colour."
  preview: "<gray>Preview: {color}████████ <gray>({hex})"
  expired: "<gray>Input timed out."

