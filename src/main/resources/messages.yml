  players-only: "<red>Only players can duel."
  invalid-sets: "<red>Sets must be 1, 3 or 5 (max {max})."
  team-not-found: "<red>No team found matching \"{name}\"."
  not-leader: "<red>Only the team leader can challenge."
  self: "<red>You cannot duel your own team."
  target-busy: "<red>{team} is already in a match or has a pending challenge."
  you-busy: "<red>Your team is already in a match or has a pending challenge."
  challenged: "<green>You challenged {team} to a best-of-{sets} duel."
