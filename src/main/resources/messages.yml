# Help command messages
help:
  header: "<gradient:#eb8c34:#ff9f40><bold>HEROIC VOLLEYBALL</bold></gradient> <gray>| <white>Help Menu</white>"
  footer: "<gray>Type <white>/volleyhelp <page></white> for more info"
  pages:
    1:
      title: "<#eb8c34><bold>GETTING STARTED</bold></#eb8c34>"
      lines:
        - " <#eb8c34>|</#eb8c34> <white>/volleywand</white> <gray>- Get selection tool"
        - " <#eb8c34>|</#eb8c34> <white>/volleyarena create <name></white> <gray>- Create arena"
        - " <#eb8c34>|</#eb8c34> <white>/setarena <red|blue></white> <gray>- Set court region"
        - " <#eb8c34>|</#eb8c34> <white>/startgame [arena]</white> <gray>- Start a match"
        - " <#eb8c34>|</#eb8c34> <white>/volleyjoin [arena]</white> <gray>- Join public queue"
    2:
      title: "<#eb8c34><bold>GAMEPLAY</bold></#eb8c34>"
      lines:
        - " <#eb8c34>|</#eb8c34> <white>Shovel</white> <gray>- Bump ball up/forward"
        - " <#eb8c34>|</#eb8c34> <white>Sword</white> <gray>- Spike (down from above)"
        - " <#eb8c34>|</#eb8c34> <white>Shield</white> <gray>- Block or catch underneath"
        - " <#eb8c34>|</#eb8c34> <white>3 touches</white> <gray>per possession"
        - " <#eb8c34>|</#eb8c34> <white>Sneak+RClick</white> <gray>- Cycle tool tier"
    3:
      title: "<#eb8c34><bold>TEAMS & DUELS</bold></#eb8c34>"
      lines:
        - " <#eb8c34>|</#eb8c34> <white>/volleyteam create <name></white> <gray>- Make a team"
        - " <#eb8c34>|</#eb8c34> <white>/volleyteam invite <player></white> <gray>- Invite player"
        - " <#eb8c34>|</#eb8c34> <white>/volleyteam info</white> <gray>- Open team GUI"
        - " <#eb8c34>|</#eb8c34> <white>/teamduel <team> <1|3|5></white> <gray>- Challenge team"
