  accept-hover: "<gray>Click to accept"
  decline-hover: "<gray>Click to decline"
  no-pending: "<red>Your team has no pending challenge."
  only-leader-respond: "<red>Only the team leader can respond."
  accepted: "<green>{team} <green>accepted your challenge!"
  declined: "<yellow>{team} declined your challenge."
  challenge-expired: "<gray>The challenge from {team} expired."
  challenge-expired-other: "<gray>Your challenge to {team} expired."
  arena-none: "<red>No free arena is available for the duel."
  lineup-title: "<dark_gray><bold>ᴄʜᴏᴏsᴇ ʏᴏᴜʀ ʟɪɴᴇᴜᴘ"
  lineup-queued: "<yellow>{player} is in the public queue and was left out of the lineup."
  lineup-min: "<red>Each team must field at least one player."
  lineup-mismatch: "<red>Both teams must field the same number of players. Your opponent chose {count}."
  lineup-ready: "<green><bold>ʀᴇᴀᴅʏ"
  lineup-unready: "<yellow><bold>ɴᴏᴛ ʀᴇᴀᴅʏ"
  lineup-ready-lore: "<gray>Confirm your starting lineup"
  lineup-selected: "<green>Selected"
