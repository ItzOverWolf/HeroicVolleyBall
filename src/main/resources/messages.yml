  not-in: "<red>You are not in a team. Create one with <white>/vb team create <name></white>."
  name-taken: "<red>Team name \"{name}\" is already taken."
  name-invalid: "<red>Invalid name. Use 3-16 letters, digits or underscores."
  name-reserved: "<red>That name is reserved."
  created: "<green>Team <white>{team}</white> <green>created!"
  created-broadcast: "<gray>{player} created the team {team}<gray>."
  leader-only: "<red>Only the team leader can do that."
  invite-usage: "<red>Usage: /vb team invite <player>"
  player-not-found: "<red>Player not found."
  self-invite: "<red>You cannot invite yourself."
  target-in-team: "<red>{player} is already in a team."
  target-in-match: "<red>{player} is currently in a match."
  full: "<red>Your team is full ({max})."
  invited: "<green>Invited {player} to {team}<green>."
  invite-received: "<green>{player} <green>invited you to join {team}<green>."
  invite-accept: "<green><bold>[ACCEPT]"
  invite-deny: "<red><bold>[DENY]"
  invite-accept-hover: "<gray>Click to join {team}"
  invite-deny-hover: "<gray>Click to decline"
  invite-expired: "<red>That invitation has expired."
  no-invite: "<red>You have no pending invitation from that team."
  joined: "<green>You joined {team}<green>!"
  joined-broadcast: "<gray>{player} joined the team. ({size}/{max})"
  denied: "<yellow>You declined the invitation from {team}<yellow>."
  denied-notify: "<gray>{player} declined your invitation to {team}."
  left: "<yellow>You left the team."
