  results-sets: "<gray>Sets: <white>{red_sets} - {blue_sets}"
  results-close: "<gray>Click to close"
  cancelled: "<gray>The duel was cancelled."

tool:
  power-set: "<gray>{tool} power set to {tier}"

give:
  usage: "<red>Usage: /vb admin give <shovel|sword|shield> [tier]"
  unknown-tool: "<red>Unknown tool \"{input}\". Use shovel, sword or shield."
  unknown-tier: "<red>Unknown tier \"{input}\". Use wooden, iron or diamond."
  received: "<green>You received the <white>{tool}</white>."

gui:
  saved-actionbar: "<green>Saved <white>Position {position}</white> <gray>({row}) for {team} <gray>in <white>{arena}</white>"
  saved-chat: "<green>Saved Position {position} ({row}) for Team {team} in arena <white>{arena}</white> at <aqua>{location}</aqua>"

backrow:
  usage: "<red>Usage: /vb admin setbackrow <red|blue> [arena]"
