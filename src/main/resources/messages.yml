  reloaded: "<green>Music configuration reloaded."

# Unified /vb help menu. Entries are filtered by permission and paginated.
# Sections are printed in the order entries first reference them; entry order
# below is the order shown. Add {command}/{description} placeholders in entry.
help:
  header: "<gradient:#f08e26:#ff9f40><bold>HEROIC VOLLEYBALL</bold></gradient> <dark_gray>| <gray>Help <dark_gray>(<white>{page}</white>/<white>{pages}</white>)"
  section: " <#f08e26><bold>{name}"
  entry: " <dark_gray>› <white>{command}</white> <dark_gray>- <gray>{description}"
  footer: "<dark_gray>Page <white>{page}</white>/<white>{pages}</white> <dark_gray>| <gray>Legacy aliases such as <white>/volleyteam</white> still work"
  footer-next: "<dark_gray>» <gray>/vb help {next}"
  lines-per-page: 12
  unknown-sub: "<red>Unknown command \"{input}\". Opening the help menu..."
  admin-usage: "<gray>Usage: <white>/vb admin <panel|guide|wand|arena|setarena|setbackrow|setballspawnpoint|spawnball|start|stop|restart|give|music|reload></white>"
  sections:
    player: "PLAYER"
    queue: "QUEUE"
    teams: "TEAMS & DUELS"
    admin: "ADMINISTRATION"
  entries:
    root:
      cmd: "/vb"
      desc: "Show this help menu"
      section: player
    help:
      cmd: "/vb help [page]"
      desc: "Browse the help pages"
      section: player
      perm: heroicvolleyball.help
    menu:
      cmd: "/vb menu"
      desc: "Open the main hub menu"
      section: player
      perm: heroicvolleyball.hub
    guide:
      cmd: "/vb guide"
      desc: "Open the illustrated gameplay guide"
      section: player
      perm: heroicvolleyball.guide
    join:
      cmd: "/vb join [arena]"
      desc: "Join the public queue (or right-click a join sign)"
      section: queue
      perm: heroicvolleyball.queue
    leave:
      cmd: "/vb leave"
      desc: "Leave your queue or current match"
      section: queue
      perm: heroicvolleyball.queue
    team:
      cmd: "/vb team <create|invite|info|...>"
      desc: "Create and manage your team (full list in /vb team)"
      section: teams
      perm: heroicvolleyball.team
    duel:
      cmd: "/vb duel <team> <1|3|5>"
      desc: "Challenge another team to a duel"
      section: teams
      perm: heroicvolleyball.team.duel
    panel:
      cmd: "/vb admin panel"
      desc: "Open the admin control panel"
      section: admin
      perm: heroicvolleyball.admin
    admin-guide:
      cmd: "/vb admin guide"
      desc: "Open the setup and administration guide"
      section: admin
      perm: heroicvolleyball.admin
    wand:
      cmd: "/vb admin wand"
      desc: "Get the arena selection wand"
      section: admin
      perm: heroicvolleyball.volleywand
    arena:
      cmd: "/vb admin arena <create|list|info|set|sign|enable|disable|clone|rename|delete>"
      desc: "Create and edit arenas"
      section: admin
      perm: heroicvolleyball.volleyarena
    setarena:
      cmd: "/vb admin setarena <red|blue> [direction] [arena]"
      desc: "Set a team's court from your wand selection"
      section: admin
      perm: heroicvolleyball.setarena
    setbackrow:
      cmd: "/vb admin setbackrow <red|blue> [arena]"
      desc: "Set a team's back-row region"
      section: admin
      perm: heroicvolleyball.setbackrow
    setballspawnpoint:
      cmd: "/vb admin setballspawnpoint <red|blue> [clear] [arena]"
      desc: "Set where a team serves from"
      section: admin
      perm: heroicvolleyball.setballspawnpoint
    spawnball:
      cmd: "/vb admin spawnball [arena]"
      desc: "Spawn the volleyball at your feet"
      section: admin
      perm: heroicvolleyball.spawnball
    start:
      cmd: "/vb admin start [arena]"
      desc: "Start a match"
      section: admin
      perm: heroicvolleyball.startgame
    stop:
      cmd: "/vb admin stop [arena]"
      desc: "Stop a running match"
      section: admin
      perm: heroicvolleyball.stopgame
    restart:
      cmd: "/vb admin restart [arena]"
      desc: "Restart a running match"
      section: admin
      perm: heroicvolleyball.restartgame
    give:
      cmd: "/vb admin give <shovel|sword|shield> [wooden|iron|diamond]"
      desc: "Give yourself a volleyball tool"
      section: admin
      perm: heroicvolleyball.volleygive
    music:
      cmd: "/vb admin music <start|stop|list|reload> [song]"
      desc: "Control match music"
      section: admin
      perm: heroicvolleyball.volleymusic
    reload:
      cmd: "/vb admin reload"
      desc: "Reload configs, messages, GUIs and arenas"
      section: admin
      perm: heroicvolleyball.volleyreload

# Public queue / lobby mode.
queue:
  disabled: "<red>Arena <white>{arena}</white> <red>is not accepting queue joins. Enable it with <white>/vb admin arena set queue {arena} true</white>."
  not-ready: "<red>Arena <white>{arena}</white> <red>is not fully set up yet."
  in-game: "<red>Arena <white>{arena}</white> <red>is already in game."
  full: "<red>The queue for <white>{arena}</white> is full."
  already-queued: "<red>You are already in a queue or a match. Leave with <white>/vb leave</white>."
  no-arenas: "<red>No queue arenas are available right now."
  not-queued: "<red>You are not in a queue."
  joined: "<green>You joined the queue for <white>{arena}</white> <gray>({players}/{max})."
  left: "<gray>You left the queue."
  team-joined: "<green>Your team {team} <green>joined the queue for <white>{arena}</white> <gray>({players}/{max})."
  team-empty: "<red>Your team has no online players to queue with."
  team-too-big: "<red>Your team has {size} online players, but this arena allows at most {max} per side."
  team-limit: "<red>This arena already has two queued teams."
  team-no-fit: "<red>Your team does not fit in the queue for <white>{arena}</white>."
  team-members-busy: "<red>{player} is already in a queue or a match."
  team-already-queued: "<red>Your team is already in a queue."
  team-not-queued: "<red>Your team is not in a queue."
  team-unqueued: "<yellow>{team} <yellow>left the queue for <white>{arena}</white>."
  countdown-started: "<gold>The match in <white>{arena}</white> starts in <white>{seconds}s</white> <gray>({players}/{max})."
  countdown-actionbar: "<gold>Starting in {seconds}s <gray>({players}/{max})"
  countdown-cancelled: "<yellow>Not enough players. Countdown cancelled."
  countdown-shortened: "<gold>The arena is full! Countdown shortened to <white>{seconds}s</white>."
  started: "<gold>Match started in <white>{arena}</white> <gray>({players} players)."
  odd-returned: "<yellow>There was an odd number of players, so you stay in the queue for the next match."
  odd-no-solo: "<yellow>Not enough players to make even sides. Countdown cancelled."
  balance-failed: "<red>Could not balance the teams. Countdown cancelled."
  match-over: "{team} <white>wins the match!"
  disconnect-pause: "<yellow>{player} disconnected. Waiting up to {seconds}s for their side before forfeiting..."
  leave-item: "<red>Leave Queue"
  board:
    title: "<gold>Volleyball Queue"
    arena: "<gray>Arena: <white>{arena}"
    players: "<gray>Players: <white>{players}</white><gray>/<white>{max}"
    min: "<gray>Minimum: <white>{min}"
    status: "<gray>Status: <white>{status}"
  status:
    waiting: "Waiting"
    starting: "Starting"
    in-game: "In game"
  sign-line-1: "<dark_aqua>{arena}"
  sign-line-2: "<white>{players}</white><gray>/<white>{max}"
  sign-line-3: "<gold>{status}"
  sign-line-4: "<gray>Click to join"
  set-usage: "<red>Usage: /vb admin arena set <lobby|min|max|queue> <arena> [value]"
  sign-usage: "<red>Usage: /vb admin arena sign <add|remove> <arena>"
  invalid-value: "<red>Value must be a number between 2 and 12."
  set-lobby: "<green>Lobby spawn for arena <white>{arena}</white> <green>set to your location."
  set-min: "<green>Minimum players for <white>{arena}</white> <green>set to <white>{value}</white>."
  set-max: "<green>Maximum players for <white>{arena}</white> <green>set to <white>{value}</white>."
  set-enabled: "<green>Arena <white>{arena}</white> <green>now accepts queue joins."
  set-disabled: "<yellow>Arena <white>{arena}</white> <yellow>no longer accepts queue joins."
  sign-look: "<red>Look at a sign within 6 blocks."
  sign-added: "<green>Added that sign to the queue for <white>{arena}</white>."
  sign-removed: "<yellow>Removed that sign from the queue for <white>{arena}</white>."
  sign-already: "<red>That sign is already a queue sign for <white>{arena}</white>."
  sign-not-found: "<red>That sign is not linked to <white>{arena}</white>."

# Inventory/effect snapshots. Players keep their normal items and effects while
# a game is running and get them back when they leave or it ends.
session:
  restored: "<green>Your inventory and effects have been restored."
  left: "<gray>You left the game. Your inventory and effects have been restored."
  no-free: "<red>No free arena is available right now."
  capacity: "<red>The server is already running the maximum number of matches."
