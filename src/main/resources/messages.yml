# HeroicVolleyBall messages
#
# Formatting uses MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Examples: <red>text</red>, <bold>, <gradient:red:blue>, <#ff00ff>
# Legacy '&' color codes are NOT used here.
#
# Placeholders are wrapped in {curly_braces}. See README.md for the full list.

# Prepended to most command feedback messages.
prefix: "<dark_aqua>[</dark_aqua><aqua>Volleyball</aqua><dark_aqua>]</dark_aqua> <gray>"

general:
  players-only: "<red>This command can only be used by players."
  no-permission: "<red>You do not have permission to do that."
  reloaded: "<green>Configuration and messages reloaded."

# Item lore shown on the volleyball tools. Each list entry is one line and uses
# MiniMessage, {tier} is the coloured tier name. Edit freely, reload live with /volleyreload.
tool:
  shovel-lore:
    - "<gray>Tier: {tier}"
    - "<gray>Left-click the ball to bump it up and forward"
    - "<gray>Higher tiers make the bump travel further and faster"
    - "<dark_gray><italic:false>Sneak + right-click to cycle power"
  sword-lore:
    - "<gray>Tier: {tier}"
    - "<gray>Left-click the ball to spike it forward"
    - "<gray>Aim from above to slam it straight down fast"
    - "<gray>Hit from below to pop it up and forward"
    - "<dark_gray><italic:false>Sneak + right-click to cycle power"
  shield-lore:
    - "<blue>Left-click the mid/top of the ball to knock it forward and down"
    - "<blue>Hold right-click underneath the ball to catch and pop it up"
    - "<blue>Shield hits never use a team touch"
    - "<blue>Every shield use starts a short cooldown"

wand:
  received: "<green>You received the Volleyball Wand. <gray>Left-click for point 1, right-click for point 2."
  point1: "<gray>Point 1 set to <aqua>{location}</aqua><gray>."
  point2: "<gray>Point 2 set to <aqua>{location}</aqua><gray>."
  both-points: "<green>Both points set! Use <white>/setarena <red|blue> [direction] [arena]<green>."

arena:
  set: "<gray>The <team> <gray>court for arena <white>{arena}</white> <gray>has been set, facing <white>{facing}</white><gray>!"
  complete: "<green>Arena <white>{arena}</white> <green>is fully set up and ready to play."
  still-incomplete: "<yellow>Arena <white>{arena}</white> <yellow>is still missing something. Run <white>/volleyarena info {arena}</white> <yellow>for details."
  usage: "<red>Usage: /setarena <red|blue> [direction] [arena]"
  usage-hint: "<gray>Direction: north, south, east, west (or n/s/e/w) plus diagonals. Omit it to face where you are looking now. Omit <white>[arena]<gray> to use the arena you are standing in (or the default)."
  unknown-team: "<red>Unknown team \"{input}\". Use red or blue."
  unknown-direction: "<red>Unknown direction \"{input}\". Use north, south, east, west or a diagonal."
  need-points: "<red>You must select two points with the Volleyball Wand (/volleywand) first."
  world-mismatch: "<red>Both points must be in the same world."
  none: "<red>No arena found here and no default arena is set. Create one with <white>/volleyarena create <name></white><red>."
  not-found: "<red>Arena \"{arena}\" does not exist."
  already-exists: "<red>Arena \"{arena}\" already exists."
  created: "<green>Arena <white>{arena}</white> <green>created. Use the wand and <white>/setarena</white>, <white>/setbackrow</white> and <white>/setballspawnpoint</white> to build it."
  cloned: "<green>Arena <white>{source}</white> <green>cloned to <white>{arena}</white><green>."
  renamed: "<green>Arena <white>{source}</white> <green>renamed to <white>{arena}</white><green>."
  deleted: "<yellow>Arena <white>{arena}</white> <yellow>deleted."
  enabled: "<green>Arena <white>{arena}</white> <green>enabled."
  disabled: "<yellow>Arena <white>{arena}</white> <yellow>disabled."
  list-empty: "<gray>No arenas exist yet. Create one with <white>/volleyarena create <name></white><gray>."
  list-header: "<gold>Arenas:"
  list-entry: "<gray> - <white>{arena}</white> <dark_gray>({state})"
  info-header: "<gold>Arena <white>{arena}</white><gold>:"
  info-state: "<gray>Enabled: <white>{state}</white> <gray>| Ready: <white>{complete}</white>"
  info-side: "<gray>  {team}<gray>: court={court} backrow={backrow} spawn={spawn} positions={positions}"
  info-default: "<gray>Default arena for unnamed commands: <white>{default}</white>"
  management-usage: "<red>Usage: /volleyarena <create|delete|clone|rename|list|info|enable|disable> [name] [name]"
  picker-title: "<dark_gray><bold>ꜱᴇʟᴇᴄᴛ ᴀʀᴇɴᴀ"
  picker-free: "<green>Free - click to play"
  picker-in-use: "<red>In use"
  picker-disabled: "<dark_gray>Disabled"
  picker-not-ready: "<yellow>Not fully set up"
  leave: "<yellow>You're out of the arena!"
  enter: "<gray>You're in the <white>{arena}</white> <gray>arena, on the {team} <gray>side"

ball:
  name: "<aqua>Volleyball</aqua>"
  lore:
    - "<gray>Right-click a block inside your own court to place it"
    - "<gray>Right-click the placed ball with an empty hand to pick it up"
    - "<dark_gray><italic:false>Picking up only works before the round starts"
  spawned: "<green>The volleyball for arena <white>{arena}</white> <green>has been spawned at your location."
  bump: "<green><bold>BUMP</bold>  <gray>Ball Up"
  spike: "<red><bold>SPIKE</bold>  <gray>Ball Spike"
  shield-block: "<blue><bold>BLOCK</bold>  <gray>Ball Forward Down"
  shield-catch: "<blue><bold>CHANCE</bold>  <gray>Ball Up"
  shield-bottom: "<gray>Hold the shield underneath the ball to catch it"
  shield-cooldown: "<gray>Your shield is recharging..."
  penalty: "<red><bold>PENALTY</bold>  <gray>You touched the opponent's ball"
  name-serve: "<gray>Serve"
  name-touches: "<{color}>Touches: {touches}/{max}"
  pickup: "<green>You picked up the ball. Right-click your own court to place it."
  place: "<green>Ball placed. Shovel it to start the round."
  pickup-denied: "<red>The ball can only be picked up before the round starts"
  pickup-backrow: "<red>You must be in the back row to pick up the ball"
  place-outside: "<red>The ball must be placed inside your team's area"

score:
  point: "{team} <white>scores!  <white>Score: {red} - {blue}"
  point-title: "{team} <white>scores!"
  point-subtitle: "<white>Score: {red} - {blue}"
  set: "{team} <white>wins the set!  <white>Sets: Red {red_sets} - {blue_sets} Blue"
  set-title: "{team} <white>wins the set!"
  set-subtitle: "<white>Sets: Red {red_sets} - {blue_sets} Blue"
  win: "{team} <white>wins the game! <gray>(Run /startgame to play again)"
  win-title: "{team} <white>wins the game!"
  win-subtitle: "<gray>Run /startgame to play again"

game:
  setup-missing: "<red><bold>Missing setup! <yellow>Fix everything below, then run /startgame again."
  setup-missing-arena: "<red>- <yellow>{team}'s arena is not set <gray>(/setarena {color})"
  setup-missing-positions: "<red>- <yellow>Positions are not set for {team} <gray>(sneak + right-click the wand to open the position menu)"
  setup-missing-spawnpoint: "<red>- <yellow>{team}'s ball spawn point is not set <gray>(/setballspawnpoint {color})"
  solo-choose: "<green>Choose your position to start a solo game."
  solo-started: "<green>Solo game started at Position {position}."
  assigned: "<green>Game on! Your team has been assigned."
  assigned-title: "{team} Team"
  assigned-subtitle: "<gray>Good luck!"
  team-full: "<red>That team is full."
  position-taken: "<red>That position is taken."
  chosen: "<green>You chose Position {position}."
  console-start: "<green>The volleyball for arena <white>{arena}</white> <green>has been placed at Position 6. Use the shovel to serve!"
  console-need-position: "<red>Position 6 has not been set for either team yet."
  stopped: "<yellow>The game in arena <white>{arena}</white> <yellow>has been stopped. The ball and music have been removed and the score reset."
  restarted: "<green>The game in arena <white>{arena}</white> <green>has been restarted! The ball has been placed at Position 6."
  not-running: "<red>No game is running in arena <white>{arena}</white><red>."
  arena-disabled: "<red>Arena <white>{arena}</white> <red>is disabled. Enable it with <white>/volleyarena enable {arena}</white><red>."
  already-running: "<red>A game is already running in arena <white>{arena}</white><red>. Stop it with <white>/stopgame {arena}</white><red> first."
  already-in-game: "<red>You are already in a game. Leave it with <white>/stopgame</white><red> or finish the match first."
  point-countdown-title: "<yellow><bold>{seconds}</bold>"
  point-countdown-subtitle: "<gray>{team} <gray>serves next..."
  round-countdown-title: "<gold><bold>{seconds}</bold>"
  round-countdown-subtitle: "<gray>Round {round} starts soon..."
  round-start: "<gold>Round {round} <white>begins! <gray>{team} <gray>serves first."
  coin-flip-title: "<gold>Coin Flip"
  coin-flip-result: "<white>{team} <gray>serves first!"
  coin-flip-broadcast: "<gray>Flipping a coin... <white>{team} <gray>serves first!"

team:
  players-only: "<red>Only players can use team commands."
  usage: "<red>Usage: /volleyteam <create|invite|accept|deny|leave|kick|transfer|disband|rename|color|info|top|chat> ..."
  already-in: "<red>You are already in a team. Leave it with <white>/volleyteam leave</white> first."
  not-in: "<red>You are not in a team. Create one with <white>/volleyteam create <name></white>."
  name-taken: "<red>Team name \"{name}\" is already taken."
  name-invalid: "<red>Invalid name. Use 3-16 letters, digits or underscores."
  name-reserved: "<red>That name is reserved."
  created: "<green>Team <white>{team}</white> <green>created!"
  created-broadcast: "<gray>{player} created the team {team}<gray>."
  leader-only: "<red>Only the team leader can do that."
  invite-usage: "<red>Usage: /volleyteam invite <player>"
  player-not-found: "<red>Player not found."
  self-invite: "<red>You cannot invite yourself."
  target-in-team: "<red>{player} is already in a team."
  target-in-match: "<red>{player} is currently in a match."
  full: "<red>Your team is full ({max})."
  invited: "<green>Invited {player} to {team}<green>."
  invite-received: "<green>{player} <green>invited you to join {team}<green>."
  invite-accept: "<green><bold>[ACCEPT]"
  invite-deny: "<red><bold>[DENY]"
  invite-accept-hover: "<gray>Click to join {team}"
  invite-deny-hover: "<gray>Click to decline"
  invite-expired: "<red>That invitation has expired."
  no-invite: "<red>You have no pending invitation from that team."
  joined: "<green>You joined {team}<green>!"
  joined-broadcast: "<gray>{player} joined the team. ({size}/{max})"
  denied: "<yellow>You declined the invitation from {team}<yellow>."
  denied-notify: "<gray>{player} declined your invitation to {team}."
  left: "<yellow>You left the team."
  leader-left: "<yellow>You left the team. Leadership passed to {player}."
  left-broadcast: "<gray>{player} left the team."
  disbanded: "<yellow>Your team has been disbanded."
  disbanded-broadcast: "<gray>The team {team} was disbanded."
  kick-usage: "<red>Usage: /volleyteam kick <player>"
  kick-self: "<red>Use <white>/volleyteam leave</white> to leave, or transfer leadership first."
  kick-not-member: "<red>{player} is not on your team."
  kicked: "<yellow>{player} was kicked from the team."
  kick-notify: "<red>You were kicked from {team}."
  transfer-usage: "<red>Usage: /volleyteam transfer <player>"
  transfer-not-member: "<red>{player} is not on your team."
  transfer-done: "<green>{player} <green>is now the team leader."
  transfer-notify: "<green>You are now the leader of {team}<green>."
  rename-usage: "<red>Usage: /volleyteam rename <name>"
  renamed: "<green>Team renamed to {team}<green>."
  color-usage: "<red>Usage: /volleyteam color <hex|name>"
  color-invalid: "<red>Invalid colour. Use a #RRGGBB hex code or a colour name."
  color-set: "<green>Team colour set to {color}<green>."
  chat-usage: "<red>Usage: /volleyteam chat <message>"
  chat-format: "<gray>[{team}<gray>] <white>{player}<gray>: <white>{message}"
  info-usage: "<red>Usage: /volleyteam info [team]"
  info-unknown: "<red>No team found matching \"{name}\"."
  info-header: "<#FF8A00><bold>{team}</bold> <dark_gray>› <gray>info"
  info-line: "<#FFB347>{label}<gray>: <white>{value}"
  info-member: "<gray>- <white>{player} <dark_gray>(<#FFB347>{role}<dark_gray>) <gray>{status}"
  top-header: "<gold>Top teams by wins:"
  top-empty: "<gray>No teams exist yet."
  top-entry: "<gray>#{rank} <white>{team} <dark_gray>- <green>{wins}W <red>{losses}L"
  in-match: "<red>You cannot do that while your team is in a match."
  role-set: "<green>Your role is now {role}<green>."
  invites-open: "<green>Invitations are now open."
  invites-closed: "<yellow>Invitations are now closed."
  invites-closed-denied: "<red>{team} is not accepting invitations right now."
  offline-kicked: "<yellow>{player} was removed from the team (offline)."

